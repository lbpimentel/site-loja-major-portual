    <g>
      <rect x="890" y="366" width="242" height="52" rx="9" fill="#111c2e"/>
      <rect x="904" y="381" width="4" height="22" rx="2" fill="#f59e0b"/>
      <rect x="920" y="381" width="130" height="9" rx="4.5" fill="#cbd5e1" opacity="0.8"/>
      <rect x="920" y="396" width="76" height="7" rx="3.5" fill="#475569"/>

      <rect x="890" y="430" width="242" height="52" rx="9" fill="#111c2e"/>
      <rect x="904" y="445" width="4" height="22" rx="2" fill="#38bdf8"/>
      <rect x="920" y="445" width="106" height="9" rx="4.5" fill="#cbd5e1" opacity="0.8"/>
      <rect x="920" y="460" width="94" height="7" rx="3.5" fill="#475569"/>

