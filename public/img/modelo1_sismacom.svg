    <circle cx="820" cy="372" r="6" fill="#f59e0b"/>
    <circle cx="820" cy="372" r="12" fill="#f59e0b" opacity="0.2"/>
    <line x1="296" y1="548" x2="820" y2="548" stroke="#334155" stroke-width="1.5"/>

