    <!-- tabela -->
    <rect x="270" y="632" width="886" height="94" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <g fill="#334155">
      <rect x="296" y="656" width="88" height="8" rx="4"/>
      <rect x="470" y="656" width="88" height="8" rx="4"/>
      <rect x="644" y="656" width="88" height="8" rx="4"/>
      <rect x="818" y="656" width="88" height="8" rx="4"/>
