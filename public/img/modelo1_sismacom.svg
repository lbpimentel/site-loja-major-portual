<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img"
     aria-label="Representação da tela de gestão do SisOriente">
  <!--
    PLACEHOLDER — substituir por um print real do sistema.

    O arquivo original (img/modelo1_sismacom.png) nunca existiu no repositorio e
    respondia 404 em producao, nos dois pontos da pagina de vendas. Este mockup
    vetorial ocupa o lugar: nao e um print de dados reais, pesa poucos KB e fica
    nitido em qualquer tamanho. Ao ter o print definitivo, basta trocar o src das
    duas <img> em sisoriente.html.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="corte"><rect width="1200" height="750" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#corte)">
    <rect width="1200" height="750" fill="url(#fundo)"/>

    <!-- barra de janela -->
    <rect width="1200" height="46" fill="#0f172a"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444" opacity="0.75"/>
    <circle cx="50" cy="23" r="6" fill="#f59e0b" opacity="0.75"/>
    <circle cx="72" cy="23" r="6" fill="#22c55e" opacity="0.75"/>
    <rect x="110" y="13" width="300" height="20" rx="10" fill="#1e293b"/>

    <!-- coluna lateral -->
    <rect x="0" y="46" width="230" height="704" fill="#0a101c"/>
    <circle cx="42" cy="90" r="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M42 82 l7 14 h-14 z" fill="#f59e0b"/>
    <rect x="68" y="83" width="104" height="9" rx="4.5" fill="#e2e8f0" opacity="0.85"/>
    <rect x="68" y="97" width="66" height="7" rx="3.5" fill="#64748b"/>

    <rect x="20" y="140" width="190" height="38" rx="9" fill="#f59e0b" opacity="0.14"/>
    <rect x="34" y="155" width="14" height="8" rx="2" fill="#f59e0b"/>
    <rect x="60" y="154" width="96" height="10" rx="5" fill="#f59e0b" opacity="0.9"/>

    <g fill="#334155">
      <rect x="34" y="199" width="14" height="8" rx="2"/><rect x="60" y="198" width="112" height="10" rx="5"/>
      <rect x="34" y="243" width="14" height="8" rx="2"/><rect x="60" y="242" width="84" height="10" rx="5"/>
      <rect x="34" y="287" width="14" height="8" rx="2"/><rect x="60" y="286" width="122" height="10" rx="5"/>
